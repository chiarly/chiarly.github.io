<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Color Sort</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;touch-action:none;user-select:none}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas><script>// ---------- Ad network shell (MRAID 2/3, Meta, Google ExitApi, plain browser) ----------
// Replace these with the advertised app's store links before shipping.
const STORE = { ios: "https://apps.apple.com/app/id000000000", android: "https://play.google.com/store/apps/details?id=com.example.game" };

// Pick the right store for this device
function storeUrl() { return /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) ? STORE.ios : STORE.android; }

// Send the player to the store using whatever the ad network provides
function cta() {
  try {
    if (window.FbPlayableAd) { FbPlayableAd.onCTAClick(); return; }
    if (window.ExitApi) { ExitApi.exit(); return; }
    if (window.mraid) { mraid.open(storeUrl()); return; }
  } catch (e) {}
  window.open(storeUrl(), "_blank");
}

// Start the game only once the ad container is ready and visible
function whenReady(start) {
  let started = false;
  const go = () => { if (!started) { started = true; start(); } };
  if (!window.mraid) { go(); return; }
  const viewable = () => { if (mraid.isViewable()) go(); else mraid.addEventListener("viewableChange", v => { if (v) go(); }); };
  if (mraid.getState() === "loading") mraid.addEventListener("ready", viewable); else viewable();
}

// Tell analytics-aware networks the player finished (optional hooks)
function adComplete() {
  try { if (window.dapi && dapi.gameEnded) dapi.gameEnded(); } catch (e) {}
}

// ---------- Color Sort playable: 2 short levels, tutorial hand, end card ----------
const COL = { r: "#ff5d73", y: "#ffe14d", b: "#3ec1ff", g: "#5ad17a" };
const LEVELS = [
  [["r", "r", "r", "y"], ["y", "y", "y", "r"], []],
  [["r", "y", "b", "r"], ["y", "b", "r", "y"], ["b", "r", "y", "b"], [], []]
];
const CAP = 4, LEVEL2_TIME = 20;
const cv = document.getElementById("c"), cx = cv.getContext("2d");
let W, H, S, tubes, lvl = 0, sel = -1, moves = 0, t = 0, lvT = 0, state = "play", flash = 0, pours = [], hint = true, endT = 0;

// Keep the canvas sharp and sized to the ad slot
function resize() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); S = Math.min(W / 420, H / 640); }

// Load a level by index
function load(i) { lvl = i; tubes = LEVELS[i].map(x => x.slice()); sel = -1; lvT = 0; hint = i === 0; }

// Screen rectangle of tube i
function tubeRect(i) { const n = tubes.length, tw = 62 * S, th = 230 * S, gap = Math.min(40 * S, (W - n * tw) / (n + 1)); const total = n * tw + (n - 1) * gap; return { x: (W - total) / 2 + i * (tw + gap), y: H * 0.5 - th / 2 + 30 * S, w: tw, h: th }; }

// True when every tube is empty or one full colour
function solved() { return tubes.every(x => x.length === 0 || (x.length === CAP && x.every(c => c === x[0]))); }

// Move the top run of balls from tube a to tube b if allowed
function pour(a, b) {
  const A = tubes[a], B = tubes[b]; if (!A.length || B.length >= CAP) return false;
  const c = A[A.length - 1]; if (B.length && B[B.length - 1] !== c) return false;
  let n = 0; while (A.length && A[A.length - 1] === c && B.length < CAP) { B.push(A.pop()); n++; }
  pours.push({ b, t: 0.25 }); moves++; return n > 0;
}

// Handle a tap on the canvas
function tap(x, y) {
  if (state === "end") { cta(); return; }
  const ib = installRect(); if (x > ib.x && x < ib.x + ib.w && y > ib.y && y < ib.y + ib.h) { cta(); return; }
  for (let i = 0; i < tubes.length; i++) { const r = tubeRect(i); if (x > r.x - 10 && x < r.x + r.w + 10 && y > r.y - 60 * S && y < r.y + r.h + 10) { pick(i); return; } }
  sel = -1;
}

// Select a tube, or pour into it if one is already selected
function pick(i) {
  hint = false;
  if (sel < 0) { if (tubes[i].length) sel = i; return; }
  if (sel === i) { sel = -1; return; }
  if (!pour(sel, i)) flash = 0.3; sel = -1;
  if (solved()) { state = "win"; endT = 1.1; }
}

// Small install button that is always visible
function installRect() { const w = 120 * S, h = 40 * S; return { x: W - w - 12 * S, y: 12 * S, w, h }; }

// Advance timers and level flow
function step(dt) {
  t += dt; lvT += dt; flash = Math.max(0, flash - dt); pours.forEach(p => p.t -= dt); pours = pours.filter(p => p.t > 0);
  if (state === "win") { endT -= dt; if (endT <= 0) { if (lvl === 0) { load(1); state = "play"; } else { state = "end"; adComplete(); } } }
  if (state === "play" && lvl === 1 && lvT > LEVEL2_TIME) { state = "end"; adComplete(); }
}

// Rounded rectangle path
function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }

// Draw one glossy ball
function ball(x, y, r, c) { const g = cx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, "#fff"); g.addColorStop(.25, c); g.addColorStop(1, c); cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); }

// Centered text helper
function text(s, x, y, size, col, weight) { cx.font = `${weight || 800} ${size}px system-ui,Segoe UI,sans-serif`; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillStyle = col; cx.fillText(s, x, y); }

// Draw the whole frame
function draw() {
  const g = cx.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#f6f1ff"); g.addColorStop(1, "#e6f4ff"); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  text(lvl === 0 ? "Sort the colors!" : "Level 2: harder!", W / 2, H * 0.12, 30 * S, "#1f2a60");
  if (lvl === 1 && state === "play") { const left = Math.max(0, Math.ceil(LEVEL2_TIME - lvT)); text(left + "s", W / 2, H * 0.12 + 36 * S, 20 * S, left < 8 ? "#ff5d73" : "#6b7398", 700); }
  for (let i = 0; i < tubes.length; i++) {
    const r = tubeRect(i), lift = sel === i ? 26 * S : 0, br = r.w * 0.38;
    cx.fillStyle = flash > 0 && sel < 0 ? "rgba(255,93,115,.10)" : "rgba(255,255,255,.75)"; rr(r.x, r.y, r.w, r.h, r.w / 2); cx.fill();
    cx.lineWidth = 3 * S; cx.strokeStyle = sel === i ? "#7b5cff" : "#c9cfe6"; cx.stroke();
    tubes[i].forEach((c, k) => { const top = k === tubes[i].length - 1; ball(r.x + r.w / 2, r.y + r.h - br - 10 * S - k * (br * 2 + 6 * S) - (top ? lift : 0), br, COL[c]); });
    if (pours.some(p => p.b === i)) { cx.strokeStyle = "rgba(123,92,255,.5)"; cx.lineWidth = 6 * S; rr(r.x - 4, r.y - 4, r.w + 8, r.h + 8, r.w / 2 + 4); cx.stroke(); }
  }
  if (hint && state === "play") drawHand();
  const ib = installRect(); cx.fillStyle = "#5ad17a"; rr(ib.x, ib.y, ib.w, ib.h, ib.h / 2); cx.fill(); text("INSTALL", ib.x + ib.w / 2, ib.y + ib.h / 2, 16 * S, "#fff");
  if (state === "win") text(lvl === 0 ? "Nice!" : "Brilliant!", W / 2, H * 0.86, 34 * S, "#7b5cff", 900);
  if (state === "end") drawEnd();
}

// Tutorial hand: tap tube 1, then tube 3
function drawHand() {
  const a = tubeRect(0), b = tubeRect(2), ph = (t % 2) / 2, from = ph < .5;
  const r = from ? a : b, x = r.x + r.w / 2 + 18 * S, y = r.y + r.h * 0.35 + Math.sin(t * 8) * 6 * S;
  text("👆", x, y + 30 * S, 54 * S, "#000");
  text(from ? "Tap a tube" : "then tap where to pour", W / 2, H * 0.92, 20 * S, "#1f2a60", 700);
}

// End card with big call to action
function drawEnd() {
  cx.fillStyle = "rgba(20,24,60,.82)"; cx.fillRect(0, 0, W, H);
  text("COLOR SORT", W / 2, H * 0.18, 44 * S, "#ffe14d", 900);
  const won = solved(); text(won ? "You're a natural!" : "So close!", W / 2, H * 0.3, 38 * S, "#fff", 900);
  text("500+ levels are waiting", W / 2, H * 0.3 + 46 * S, 22 * S, "#c9cfe6", 700);
  const bw = 260 * S, bh = 70 * S, bx = (W - bw) / 2, by = H * 0.55, p = 1 + Math.sin(t * 6) * 0.04;
  cx.save(); cx.translate(W / 2, by + bh / 2); cx.scale(p, p); cx.fillStyle = "#5ad17a"; rr(-bw / 2, -bh / 2, bw, bh, bh / 2); cx.fill(); text("PLAY NOW", 0, 0, 30 * S, "#fff", 900); cx.restore();
}

// Main loop
let last = 0;
function frame(ts) { const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; step(dt); draw(); requestAnimationFrame(frame); }

// Boot once the ad container says go
whenReady(() => {
  resize(); addEventListener("resize", resize); load(0);
  cv.addEventListener("pointerdown", e => { e.preventDefault(); tap(e.clientX, e.clientY); });
  requestAnimationFrame(frame);
});
</script></body></html>
